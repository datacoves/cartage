# Cartage project settings.
project: demo
environments: [dev, prd]
default_env: dev

defaults:
  engine: dlt          # or: python (needs no extra dependencies)

# Where incremental state lives, per environment (default: .cartage/state).
# prd: { connection: materials_s3, prefix: cartage/state/ }
state:
  dev: { path: .cartage/state }

orchestrators:
  airflow:
    dags_dir: dags
    default_args: { owner: data-team, retries: 1 }
    # image: myregistry/cartage-worker:0.1    # KubernetesExecutor pod image
