# Named connections, one settings block per environment.
# Never put secret values here: reference them as ${secret:dotted.key} or ${env:VAR}.
connections:
  local_files:
    type: filesystem
    envs:
      dev: { path: ./data }
      prd: { path: ./data }

  sap_erp:
    type: sap
    envs:
      dev: { transport: mock, client: "100" }
      prd:
        transport: rfc
        ashost: sap.example.com
        sysnr: "00"
        client: "100"
        user: ${secret:sap.user}
        passwd: ${secret:sap.passwd}

