name: materials_to_sap
source:
  connection: local_files
  format: csv
  path: materials/*.csv
  reader_options: { dtype: str, keep_default_na: false }   # keep codes as text ("000123"), empty cells as ""
  incremental: true          # only files changed since the last run
transforms:
  - map: transforms.materials:normalize_uom
  - filter: transforms.materials:is_active
  - batch: transforms.materials:dedupe
    with: { key: material }
destination:
  connection: sap_erp
  bapi: BAPI_MATERIAL_SAVEDATA
  mapping:
    HEADDATA.MATERIAL: material
    HEADDATA.IND_SECTOR: industry
    HEADDATA.MATL_TYPE: type
    MATERIALDESCRIPTION[].MATL_DESC: description
    CLIENTDATA.BASE_UOM: uom
  constants:
    MATERIALDESCRIPTION[].LANGU_ISO: EN
    HEADDATA.BASIC_VIEW: X
  commit: per_record
schedule:
  airflow:
    schedule: "0 3 * * *"
    tags: [sap, materials]
