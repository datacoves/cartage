[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartage"
version = "0.4.0"
description = "Declarative data migrations: YAML pipelines, Python transforms, any engine, any orchestrator."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11.4"  # tarfile extractall(filter="data")
dependencies = [
  "click>=8.1",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "ruamel.yaml>=0.18",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dlt = ["dlt>=1.20"]
s3 = ["boto3>=1.34"]
airflow = ["apache-airflow>=3.0", "apache-airflow-providers-standard>=1.0", "kubernetes>=29"]
all = ["cartage[dlt,s3,airflow]"]

[project.scripts]
cartage = "cartage.cli:app"

[project.entry-points."cartage.sources"]
filesystem = "cartage.adapters.sources.filesystem:FilesystemSource"
s3 = "cartage.adapters.sources.s3:S3Source"
dlt = "cartage.adapters.sources.dlt:DltSourceAdapter"

[project.entry-points."cartage.destinations"]
sap = "cartage.adapters.destinations.sap.destination:SapDestination"
dlt = "cartage.adapters.destinations.dlt:DltDestinationAdapter"

[project.entry-points."cartage.engines"]
python = "cartage.adapters.engines.python:PythonEngine"
dlt = "cartage.adapters.engines.dlt:DltEngine"

[project.entry-points."cartage.orchestrators"]
airflow = "cartage.adapters.orchestrators.airflow:AirflowOrchestrator"
dagster = "cartage.adapters.orchestrators.scripts:DagsterOrchestrator"
prefect = "cartage.adapters.orchestrators.scripts:PrefectOrchestrator"

[dependency-groups]
dev = ["pytest>=8", "dlt>=1.20", "boto3>=1.34", "moto[s3]>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/cartage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["airflow: needs apache-airflow (uv run --extra airflow pytest -m airflow)"]
